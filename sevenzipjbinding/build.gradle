apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

def jitpack = providers.environmentVariable('JITPACK').orNull == 'true'
def publishedArtifact = jitpack ? providers.environmentVariable('ARTIFACT').get() : 'sevenzipjbinding'
group = jitpack ? providers.environmentVariable('GROUP').get() : 'net.sf.sevenzipjbinding'
version = jitpack ? providers.environmentVariable('VERSION').get() : '16.02-2.02-16kb.2'

// 将原始许可随 Maven 制品交付，使用独立路径避免宿主合并时同名冲突。
def licenseResources = layout.buildDirectory.dir('generated/sevenzipLicenseResources')
def prepareLicenses = tasks.register('prepareSevenZipLicenses', Sync) {
    into licenseResources
    into('META-INF/sevenzipjbinding') {
        from(rootProject.file('LICENSE')) { rename { 'LGPL-2.1.txt' } }
        from('src/main/cpp/p7zip/DOC/License.txt') { rename { '7-Zip-License.txt' } }
        from('src/main/cpp/p7zip/DOC/unRarLicense.txt')
    }
}
tasks.named('preBuild') { dependsOn prepareLicenses }

android {
    namespace 'net.sf.sevenzipjbinding'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main.resources.srcDir licenseResources
    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = publishedArtifact
                pom {
                    name = '7-Zip-JBinding for Android'
                    description = 'Android Java wrapper for the 7-Zip archive engine'
                    url = 'https://github.com/omicronapps/7-Zip-JBinding-4Android'
                    licenses {
                        license {
                            name = 'GNU Lesser General Public License, version 2.1'
                            url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                        }
                    }
                }
            }
        }
    }
}
